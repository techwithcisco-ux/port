{% extends "core/base.html" %}{% block content %}
<h1>Expenses</h1>
<div class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn">Add expense</button></form></div>
<div class="card" style="margin-top:12px"><table><tr><th>Date</th><th>Category</th><th>Description</th><th>Amount</th><th>Branch</th></tr>
{% for e in expenses %}<tr><td>{{ e.created_at }}</td><td>{{ e.category }}</td><td>{{ e.description }}</td><td>{{ e.amount }}</td><td>{{ e.branch.name|default:"—" }}</td></tr>{% endfor %}</table></div>
{% endblock %}
