{% extends "core/base.html" %}{% block content %}
<h1>Suppliers</h1>
<div class="card"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn">Add supplier</button></form></div>
<div class="card" style="margin-top:12px"><table><tr><th>Supplier</th><th>Owed (intakes)</th><th>Paid</th><th>Balance</th></tr>
{% for r in ledger %}<tr><td>{{ r.s.name }}</td><td>{{ r.owed }}</td><td>{{ r.paid }}</td><td><b>{{ r.balance }}</b></td></tr>{% endfor %}</table></div>
{% endblock %}
