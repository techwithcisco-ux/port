# BranchPort on Render — Postgres + API + 3 static frontends.
#
# Setup order:
#   1. Push this repo, create a Blueprint from render.yaml.
#   2. Render provisions `branchport-db` (Postgres 16, free tier) and
#      generates JWT_SECRET + MARKET_ADMIN_PASS on branchport-api.
#   3. After the DB is live, run the schema once:
#        psql $DATABASE_URL -f apps/api/schema.sql
#      (Get DATABASE_URL from the branchport-db dashboard → Connections.)
#   4. Open the dashboard URL, sign up the owner account, invite staff.
#   5. Market analytics: read MARKET_ADMIN_PASS from branchport-api →
#      Environment in the Render dashboard and use it to sign in at /market.

databases:
  - name: branchport-db
    databaseName: branchport
    user: branchport
    plan: free

services:
  # ── API (Node + Express + pg + JWT) ──────────────────────────
  - name: branchport-api
    type: web
    runtime: node
    # Repo root: install the npm workspaces (hoists express/pg/jwt), then
    # start the API workspace. Must NOT set rootDir to apps/api — its
    # deps live in the root node_modules via workspaces.
    buildCommand: npm install
    startCommand: npm start --workspace=@branchport/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: branchport-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_DAYS
        value: 30
      # Admin password for the Market analytics dashboard. Verified
      # server-side by POST /platform/login — read the generated value in
      # the Render dashboard (branchport-api → Environment) to sign in.
      - key: MARKET_ADMIN_PASS
        generateValue: true

  # ── Dashboard (manager + owner) ──────────────────────────────
  - name: branchport-dashboard
    type: web
    runtime: static
    buildCommand: npm install && npm run build --workspace=@branchport/shared && npm run build:dashboard
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: branchport-api
          type: web
          property: host
          # Render injects `https://<host>` — the dashboard appends /api paths.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── POS (staff till) ─────────────────────────────────────────
  - name: branchport-pos
    type: web
    runtime: static
    # VITE_BASE=/ builds the POS to serve from the site root (its default
    # /pos/ base is for the legacy combined Vercel deploy).
    buildCommand: npm install && npm run build --workspace=@branchport/shared && VITE_BASE=/ npm run build:pos
    staticPublishPath: apps/pos/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: branchport-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Market analytics ─────────────────────────────────────────
  - name: branchport-market
    type: web
    runtime: static
    buildCommand: npm install && npm run build --workspace=@branchport/shared && VITE_BASE=/ npm run build:market
    staticPublishPath: apps/market/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: branchport-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
