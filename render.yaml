# BranchPort on Render — Postgres + API + 3 static frontends.
#
# Setup order:
#   1. Push this repo, create a Blueprint from render.yaml.
#   2. Render provisions `branchport-db` (Postgres 16, free tier).
#   3. After the DB is live, run the schema once:
#        psql $DATABASE_URL -f apps/api/schema.sql
#      (Get DATABASE_URL from the branchport-db dashboard → Connections.)
#   4. Set JWT_SECRET on branchport-api (Generate → save), then deploy.
#   5. Open the dashboard URL, sign up the owner account, invite staff.

databases:
  - name: branchport-db
    databaseName: branchport
    user: branchport
    plan: free

services:
  # ── API (Node + Express + pg + JWT) ──────────────────────────
  - name: branchport-api
    type: web
    runtime: node
    rootDir: branchport/apps/api
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: branchport-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL
        value: 30d

  # ── Dashboard (manager + owner) ──────────────────────────────
  - name: branchport-dashboard
    type: web
    runtime: static
    rootDir: branchport
    buildCommand: npm install && npm run build --workspace=@branchport/shared && npm run build:dashboard
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: branchport-api
          type: web
          property: host
          # Render injects `https://<host>` — the dashboard appends /api paths.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── POS (staff till) ─────────────────────────────────────────
  - name: branchport-pos
    type: web
    runtime: static
    rootDir: branchport
    buildCommand: npm install && npm run build --workspace=@branchport/shared && npm run build:pos
    staticPublishPath: apps/pos/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: branchport-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ── Market analytics ─────────────────────────────────────────
  - name: branchport-market
    type: web
    runtime: static
    rootDir: branchport
    buildCommand: npm install && npm run build --workspace=@branchport/shared && VITE_BASE=/ npm run build:market
    staticPublishPath: apps/market/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: branchport-api
          type: web
          property: host
      - key: VITE_MARKET_ADMIN_PASS
        generateValue: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
