  # Dashboard — main management app
  - name: branchport-dashboard
    type: web
    runtime: static
    buildCommand: npm install && npm run build:dashboard
    staticPublishPath: apps/dashboard/dist
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://knivhbxshdsfyrboxvnm.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtuaXZoYnhzaGRzZnlyYm94dm5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MjIwMDUsImV4cCI6MjEwNDA5ODAwNX0.q_qgyDvH4KqY0APPFrv9btRGDEACN7ghMMYx0hr9BMo
      - key: VITE_DEMO_MODE
        value: "0"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # POS — point of sale app
